name: Deploy Maps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website and Mapbox configuration
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          mkdir -p _site/mapbox

          cp -R \
            Transit-Connectivity-Job-Access-main \
            Transit-Connectivity-Land-Area-main \
            job-access-only-main \
            land-area-only-main \
            _site/

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("MAPBOX_TOKEN", "").strip()

          if not token.startswith("pk."):
              raise SystemExit(
                  "MAPBOX_TOKEN must be a public Mapbox token starting with pk."
              )

          Path("_site/mapbox/config.js").write_text(
              "mapboxgl.accessToken = " + json.dumps(token) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
